<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSU Engineering Job Tracker | GATE & Direct Recruitment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
          <h1 class="text-xl font-bold tracking-tight text-slate-900">PSU Engineering Job Tracker</h1>
        </div>
        <p class="text-xs text-slate-500 mt-0.5">Direct notifications for B.Tech & Diploma engineering recruitments</p>
      </div>
      <div>
        <span class="inline-flex items-center px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-semibold rounded-full">
          Live & Updated
        </span>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="max-w-6xl mx-auto px-4 pb-3 flex flex-wrap gap-2 text-xs">
      <select id="branchFilter" class="bg-slate-100 border border-slate-300 rounded px-2.5 py-1.5 font-medium text-slate-700">
        <option value="ALL">All Disciplines</option>
        <option value="EE">Electrical (EE)</option>
        <option value="ME">Mechanical (ME)</option>
        <option value="CSE">Computer Science (CSE / IT)</option>
        <option value="CE">Civil (CE)</option>
        <option value="CI">Instrumentation (C&I / ECE)</option>
      </select>

      <select id="modeFilter" class="bg-slate-100 border border-slate-300 rounded px-2.5 py-1.5 font-medium text-slate-700">
        <option value="ALL">All Hiring Routes</option>
        <option value="GATE">Through GATE</option>
        <option value="CBT">Direct CBT (Without GATE)</option>
      </select>

      <select id="catFilter" class="bg-slate-100 border border-slate-300 rounded px-2.5 py-1.5 font-medium text-slate-700">
        <option value="ALL">All PSU Categories</option>
        <option value="Maharatna">Maharatna</option>
        <option value="Navratna">Navratna</option>
      </select>
    </div>
  </header>

  <!-- Job Table -->
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-100 text-xs uppercase font-semibold text-slate-700 border-b border-slate-200">
            <tr>
              <th class="px-4 py-3">PSU / Org</th>
              <th class="px-4 py-3">Post Title</th>
              <th class="px-4 py-3">Branches</th>
              <th class="px-4 py-3">Route</th>
              <th class="px-4 py-3">Pay Scale</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="jobTableBody" class="divide-y divide-slate-200"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const jobs = [
      {
        org: "NTPC Limited",
        category: "Maharatna",
        title: "Executive Trainee (EET)",
        branches: ["EE", "ME", "CI", "CE", "CSE"],
        mode: "GATE",
        scale: "E-2 (₹60k - ₹1.8L)",
        deadline: "2026-11-20",
        applyUrl: "https://careers.ntpc.co.in"
      },
      {
        org: "Power Grid (PGCIL)",
        category: "Maharatna",
        title: "Engineer Trainee",
        branches: ["EE", "CE", "CSE"],
        mode: "GATE",
        scale: "E-2 (₹60k - ₹1.8L)",
        deadline: "2026-11-15",
        applyUrl: "https://www.powergrid.in"
      },
      {
        org: "Coal India Limited",
        category: "Maharatna",
        title: "Management Trainee (MT)",
        branches: ["ME", "EE", "CE"],
        mode: "CBT",
        scale: "E-2 (₹50k - ₹1.6L)",
        deadline: "2026-11-30",
        applyUrl: "https://www.coalindia.in"
      },
      {
        org: "BEL (Bharat Electronics)",
        category: "Navratna",
        title: "Project Engineer",
        branches: ["CSE", "CI"],
        mode: "CBT",
        scale: "Consolidated (₹40k - ₹55k)",
        deadline: "2026-11-10",
        applyUrl: "https://bel-india.in"
      }
    ];

    function render() {
      const branch = document.getElementById("branchFilter").value;
      const mode = document.getElementById("modeFilter").value;
      const cat = document.getElementById("catFilter").value;
      const tbody = document.getElementById("jobTableBody");

      const filtered = jobs.filter(j => {
        const matchBranch = branch === "ALL" || j.branches.includes(branch);
        const matchMode = mode === "ALL" || j.mode === mode;
        const matchCat = cat === "ALL" || j.category === cat;
        return matchBranch && matchMode && matchCat;
      });

      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-400">No jobs match your selection.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(j => `
        <tr class="hover:bg-slate-50">
          <td class="px-4 py-3 font-semibold text-slate-900">
            ${j.org} <span class="text-[10px] bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded font-normal">${j.category}</span>
          </td>
          <td class="px-4 py-3 text-slate-800">${j.title}</td>
          <td class="px-4 py-3">${j.branches.map(b => `<span class="bg-slate-100 text-[11px] font-medium px-1.5 py-0.5 rounded mr-1">${b}</span>`).join("")}</td>
          <td class="px-4 py-3"><span class="px-2 py-0.5 text-xs rounded font-semibold ${j.mode === 'GATE' ? 'bg-purple-100 text-purple-700' : 'bg-emerald-100 text-emerald-700'}">${j.mode}</span></td>
          <td class="px-4 py-3 font-mono text-xs">${j.scale}</td>
          <td class="px-4 py-3 text-xs text-slate-600">${j.deadline}</td>
          <td class="px-4 py-3 text-right">
            <a href="${j.applyUrl}" target="_blank" class="px-3 py-1 bg-slate-900 hover:bg-slate-800 text-white rounded text-xs font-medium">Apply</a>
          </td>
        </tr>
      `).join("");
    }

    document.getElementById("branchFilter").onchange = render;
    document.getElementById("modeFilter").onchange = render;
    document.getElementById("catFilter").onchange = render;
    render();
  </script>
</body>
</html>
